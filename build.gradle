plugins {
    id "java"
    id "com.gradleup.shadow" version "9.0.2"
}

ext {
    JAVA_VERSION = 25
    MINECRAFT_VERSION = "26.3"
    PAPER_VERSION = MINECRAFT_VERSION + ".build.+"
}

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

group = "com.github.FortyTwoFortyTwo"
version = "1.0.0"

java {
    def javaVersion = JavaVersion.toVersion(project.JAVA_VERSION)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(project.JAVA_VERSION)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.deprecation = true
    options.release.set(JAVA_VERSION)
    options.compilerArgs += ['-Xlint:all', '-Xlint:-processing', '-Xlint:-serial', '-Xlint:-this-escape']
}

// ─────────────────────────────────────────────────────────────────────────────
// Source sets
//   MinecraftAgent  →  Bukkit plugin JAR  (shaded)
//   McpBridge       →  Standalone MCP JAR (shaded, has Main)
//   Shared          →  Shared deps
// ─────────────────────────────────────────────────────────────────────────────

sourceSets {
    main {
        // Disable the default src/main so nothing leaks into both
        java {
            srcDirs = []
        }
        resources {
            srcDirs = []
        }
    }

    // Each source set uses the same src/main/java root so packages match their directories, filtered down to its own folder
    shared {
        java {
            srcDirs = ["src/main/java"]
            include "com/github/FortyTwoFortyTwo/Shared/**"
        }
    }

    minecraftAgent {
        java {
            srcDirs = ["src/main/java"]
            include "com/github/FortyTwoFortyTwo/MinecraftAgent/**"
        }
        resources {
            srcDirs = ["src/main/resources"]
        }
        // Makes Shared classes visible to MinecraftAgent at compile time
        compileClasspath += sourceSets.shared.output
        runtimeClasspath += sourceSets.shared.output
    }

    mcpBridge {
        java {
            srcDirs = ["src/main/java"]
            include "com/github/FortyTwoFortyTwo/McpBridge/**"
        }
        // Makes Shared classes visible to McpBridge at compile time
        compileClasspath += sourceSets.shared.output
        runtimeClasspath += sourceSets.shared.output
    }
}

// ─────────────────────────────────────────────────────────────────────────────
// Dependencies per source set
// ─────────────────────────────────────────────────────────────────────────────

dependencies {
    // ── MinecraftAgent (Bukkit plugin) ──────────────────────────────────────
    // Log4j is provided by the server, the plugin hooks into its loggers
    minecraftAgentCompileOnly("io.papermc.paper:paper-api:" + project.PAPER_VERSION)
    minecraftAgentCompileOnly("org.apache.logging.log4j:log4j-core:2.25.3")
    minecraftAgentImplementation("io.modelcontextprotocol.sdk:mcp-json-jackson2:0.18.1")
    minecraftAgentImplementation("org.eclipse.jgit:org.eclipse.jgit:7.6.0.202603022253-r")

    // ── McpBridge (standalone MCP JAR) ──────────────────────────────────────
    mcpBridgeImplementation("io.papermc.paper:paper-api:" + project.PAPER_VERSION)
    mcpBridgeImplementation("io.modelcontextprotocol.sdk:mcp:0.18.1")
    mcpBridgeImplementation("org.apache.logging.log4j:log4j-core:2.25.3")
    mcpBridgeImplementation("org.apache.logging.log4j:log4j-api:2.25.3")
    mcpBridgeImplementation("com.google.code.gson:gson:2.13.2")

    // ── Shared ──────────────────────────────────────────────────────────────
    // Only compiled against, each JAR above ships what it needs at runtime
    sharedCompileOnly("io.papermc.paper:paper-api:" + project.PAPER_VERSION)
    sharedCompileOnly("com.google.code.gson:gson:2.13.2")
    sharedCompileOnly("io.modelcontextprotocol.sdk:mcp:0.18.1")
    sharedCompileOnly("org.apache.logging.log4j:log4j-core:2.25.3")
    sharedCompileOnly("org.eclipse.jgit:org.eclipse.jgit:7.6.0.202603022253-r")
}

// ─────────────────────────────────────────────────────────────────────────────
// Shadow JARs
// ─────────────────────────────────────────────────────────────────────────────

tasks.register("shadowMinecraftAgent", com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    group = "build"
    description = "Builds the shaded Bukkit plugin JAR"

    archiveBaseName.set("MinecraftAgent")
    archiveClassifier.set("")
    archiveVersion.set(version)

    from sourceSets.minecraftAgent.output
    from sourceSets.shared.output
    configurations = [project.configurations.minecraftAgentRuntimeClasspath]

    // Signed dependencies (e.g. JGit) ship signature files that become invalid once shaded
    exclude("META-INF/*.SF", "META-INF/*.DSA", "META-INF/*.RSA", "META-INF/*.EC")
}

tasks.register("shadowMcpBridge", com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    group = "build"
    description = "Builds the shaded standalone MCP bridge JAR"

    archiveBaseName.set("McpBridge")
    archiveClassifier.set("")
    archiveVersion.set(version)

    from sourceSets.mcpBridge.output
    from sourceSets.shared.output
    configurations = [project.configurations.mcpBridgeRuntimeClasspath]

    // Signed dependencies (e.g. JGit) ship signature files that become invalid once shaded
    exclude("META-INF/*.SF", "META-INF/*.DSA", "META-INF/*.RSA", "META-INF/*.EC")

    manifest {
        attributes "Main-Class": "com.github.FortyTwoFortyTwo.McpBridge.Main"
    }
}

// The default jar/shadowJar tasks are replaced by the two above
jar {
    enabled = false
}

shadowJar {
    enabled = false
}

build {
    dependsOn(shadowMinecraftAgent, shadowMcpBridge)
}

processMinecraftAgentResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
