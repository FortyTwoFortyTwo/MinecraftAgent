bridge:
  enabled: false
  port: 25580
  # Leave empty to generate a random secret on startup. McpBridge needs the same value in MC_BRIDGE_SECRET.
  secret: ""

anthropic:
  model: "claude-sonnet-5-5"
  max-tokens: 1024
  # Budget per prompt: stop after this many API round-trips or accumulated tokens
  max-turns: 20
  max-total-tokens: 100000
  secret: "sk-ant-api03-XXXXX"

# Used by /agent mcp and /agent code, which run the Claude Code CLI and can be billed to a Claude Pro/Max subscription instead of the API
claude-code:
  # Path to the claude executable. Leave empty to use ~/.local/bin/claude from `/claudeinstall` if it exists,
  # otherwise search PATH (on Windows, resolves npm's claude.cmd to its claude.exe).
  executable: ""
  # Token from running `claude setup-token`. Leave empty to use the host's own `claude login` session.
  oauth-token: ""
  # Leave empty to use the default model for the logged in plan
  model: ""
  max-turns: 20

error-catcher:
  # Maximum number of automatic agent runs triggered by server errors per hour
  max-runs-per-hour: 5

directories:

# Shown on the agent's progress boss bar while it's thinking, one picked at random every turn
thinking-statuses:
  - "Thinking"
  - "Pondering"
  - "Contemplating"
  - "Mulling it over"
  - "Brainstorming"
  - "Scheming"
  - "Cogitating"
  - "Ruminating"
  - "Noodling"
  - "Brewing"
  - "Daydreaming"
  - "Galaxy braining"
  - "Overthinking"
  - "Reticulating splines"
  - "Asking the villagers"
  - "Hmmming"
  - "Big brain time"
  - "Evil plotting"
  - "Calculating the meaning of life"
  - "Consulting the Thinker"
  - "Wasting claude tokens"
  - "Consuming electric grid power"
  - "AI slopping"
  - "Gathering secret keys"

# Every interval, a few random players submit a prompt, then everyone votes on which one gets sent to the agent
prompt-vote:
  enabled: true
  # Agent type the winning prompt runs as, the same as /agent <type>. Arguments before the prompt can follow, e.g. "code <directory>".
  # The prompt runs as the player who submitted it, with all of that type's tools, and its replies are shown to everyone.
  type: "mcp"
  interval-seconds: 120
  # How many players are picked to submit a prompt each round. Players are picked from a shuffled list, so everyone gets a turn before anyone repeats.
  submitters: 4
  # Skip the round if fewer players than this are online
  min-players: 1
  submit-seconds: 60
  vote-seconds: 30
  max-prompt-length: 200
  # The most recent winners, as a percent of online players from 0 to 1, can't be picked again. e.g. 0.5 with 10 players online means the last 5 winners can't be picked.
  # At least one player is always left eligible.
  winner-cooldown-percent: 0.6
